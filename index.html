      case 'remove-question':{const builder=document.getElementById('builder');button.closest('[data-question]')?.remove();if(builder)Array.from(builder.children).forEach((card,i)=>{card.querySelector('.builder-top span').textContent=`Question ${i+1}`;});break;}
      case 'preview':{const exam=data.exams.find(item=>item.id===button.dataset.id);if(exam)start(exam);break;}
      case 'publish':{const exam=data.exams.find(item=>item.id===button.dataset.id);if(exam){exam.status=exam.status==='Live'?'Closed':'Live';exam.updated='Just now';save();render();toast(`${exam.title} is now ${exam.status.toLowerCase()}.`);}break;}
      case 'remove-candidate':{const person=data.candidates.find(item=>item.id===button.dataset.id);if(person&&confirm(`Remove ${person.name} from this workspace?`)){data.candidates=data.candidates.filter(item=>item.id!==person.id);save();render();toast('Candidate removed.');}break;}
      case 'export-results':exportCSV('formative-results.csv',[['Candidate','Assessment','Score','Correct','Questions','Submitted'],...data.results.map(item=>[item.candidate,item.exam,item.score,item.correct,item.total,item.date])]);break;
      case 'export-candidates':exportCSV('formative-candidates.csv',[['Name','Email','Group','Status','Joined'],...data.candidates.map(item=>[item.name,item.email,item.group,item.status,item.joined])]);break;
      case 'setting':{const key=button.dataset.key;if(Object.hasOwn(data.settings,key))data.settings[key]=!data.settings[key];save();render();break;}
      case 'answer':if(attempt){attempt.answers[attempt.index]=Number(button.dataset.answer);renderAttempt();}break;
      case 'next':if(attempt&&attempt.index<currentExam().questions.length-1){attempt.index++;renderAttempt();}break;
      case 'previous':if(attempt&&attempt.index>0&&data.settings.review){attempt.index--;renderAttempt();}break;
      case 'jump':if(attempt&&(data.settings.review||Number(button.dataset.index)>=attempt.index)){attempt.index=Number(button.dataset.index);renderAttempt();}break;
      case 'submit':finish();break;case 'return-results':view='Results';query='';render();break;
    }
  });
  document.addEventListener('submit',event=>{
    if(event.target.id==='exam-form'){
      event.preventDefault();const form=event.target,title=form.elements.title.value.trim(),subject=form.elements.subject.value.trim(),duration=Number(form.elements.duration.value),cards=Array.from(form.querySelectorAll('[data-question]'));
      const questions=cards.map(card=>({prompt:card.querySelector('[name="prompt"]').value.trim(),choices:[0,1,2,3].map(i=>card.querySelector(`[name="option${i}"]`).value.trim()),answer:Number(card.querySelector('[name="answer"]').value)}));
      if(!title||!subject||duration<1||!questions.length||questions.some(item=>!item.prompt||item.choices.some(choice=>!choice))){toast('Complete each question and all four answer choices.');return;}
      data.exams.unshift({id:`EX-${Date.now().toString().slice(-6)}`,title,subject,duration,status:'Draft',updated:'Just now',attempts:0,questions});save();overlay.innerHTML='';view='Exams';filter='All';render();toast('Your exam draft has been created.');
    }
    if(event.target.id==='candidate-form'){
      event.preventDefault();const form=event.target,name=form.elements.name.value.trim(),email=form.elements.email.value.trim().toLowerCase(),group=form.elements.group.value.trim();
      if(data.candidates.some(person=>person.email.toLowerCase()===email)){toast('A candidate with that email already exists.');form.elements.email.focus();return;}
      data.candidates.unshift({id:`ST-${Date.now().toString().slice(-6)}`,name,email,group,status:'Active',joined:'Today'});save();overlay.innerHTML='';view='Candidates';render();toast(`${name} has been added.`);
    }
  });
  document.addEventListener('input',event=>{if(event.target.id!=='search')return;const position=event.target.selectionStart;query=event.target.value;if(!['Exams','Candidates','Results'].includes(view))return;const content=document.getElementById('content'),scratch=document.createElement('div');scratch.innerHTML=renderers[view]();const oldTable=content.querySelector('.table-panel'),newTable=scratch.querySelector('.table-panel'),oldToolbar=content.querySelector('.toolbar'),newToolbar=scratch.querySelector('.toolbar');if(oldTable&&newTable)oldTable.replaceWith(newTable);if(oldToolbar&&newToolbar)oldToolbar.replaceWith(newToolbar);const search=document.getElementById('search');if(search){search.value=query;search.setSelectionRange(position,position);}});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&overlay.innerHTML)overlay.innerHTML='';});
  render();
})();
</script>
</body>
</html>
